<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroFlow 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
      #root { width: 100vw; height: 100vh; }
      /* Global fade - opacity only, no movement */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Themed scrollbars: thin, faded, indigo on hover */
      * {
          scrollbar-width: thin;
          scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.16);
          border: 3px solid transparent;
          border-radius: 999px;
          background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
          background: rgba(99, 102, 241, 0.45);
          background-clip: padding-box;
      }
      ::-webkit-scrollbar-button { display: none; }
      ::-webkit-scrollbar-corner { background: transparent; }
      /* Opt-out where a panel deliberately hides its scrollbar */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>

  }
}
